# Local development services for UBOS
name: ubos
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ubos
      POSTGRES_PASSWORD: ubos
      POSTGRES_DB: ubos
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ubos"]
      interval: 3s
      retries: 20

  # Local mailbox for login codes and notifications: SMTP on 1025, web inbox on http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21.8
    ports: ["1025:1025", "8025:8025"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ubos
      MINIO_ROOT_PASSWORD: ubos-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

volumes:
  pgdata:
  miniodata:
